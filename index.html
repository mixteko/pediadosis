<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pediadosis Pro - Dosis Pediátricas Seguras</title>
    
    <!-- PWA & Mobile Install configurations -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#006877" />
    
    <!-- iOS / Safari Web App Touch optimization -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pediadosis Pro" />
    <link rel="apple-touch-icon" href="/icon_192.png" />
    
    <!-- Service Worker background activation loader -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Pediadosis Service Worker registered successfully:', reg.scope))
            .catch((err) => console.error('Pediadosis Service Worker registration registry failed:', err));
        });
      }
    </script>
  </head>
  <body class="safe-paddings">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
